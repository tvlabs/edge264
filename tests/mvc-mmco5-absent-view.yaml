--- # MMCO5 in the base view with a non-reference non-base view, then an access unit missing the non-base view
# MMCO5 applies to both views (G.8.1), so the non-base view loses its references although its
# own picture carries no marking, and must not regain them when it is absent from the next
# access unit (replaced by a gray non-existing view). The IDRs are I_PCM with luma 64 in the
# base view and 192 in the non-base view, and P slices copy their first reference, so any stale
# reference shows in output samples.
# Expected non-base luma: 192 192 192 128 64 64 (AU 4 has only its base view to predict from)
- nal_ref_idc: 3
  nal_unit_type: 7 # Sequence parameter set (base view)
  profile_idc: 66
  constraint_set_flags: [0,0,0,0,0,0]
  level_idc: 1.0
  log2_max_frame_num: 4
  pic_order_cnt_type: 0
  log2_max_pic_order_cnt_lsb: 4
  max_num_ref_frames: 2
  gaps_in_frame_num_value_allowed_flag: 0
  pic_size_in_mbs: {width: 1, height: 1}
  frame_mbs_only_flag: 1
  direct_8x8_inference_flag: 0
- nal_ref_idc: 3
  nal_unit_type: 8 # Picture parameter set (base view)
  pic_parameter_set_id: 0
  entropy_coding_mode_flag: 0
  bottom_field_pic_order_in_frame_present_flag: 0
  num_slice_groups: 1
  num_ref_idx_default_active: {l0: 1, l1: 1}
  weighted_pred_flag: 0
  weighted_bipred_idc: 0
  pic_init_qp: 0
  chroma_qp_index_offset: 0
  deblocking_filter_control_present_flag: 0
  constrained_intra_pred_flag: 0
  redundant_pic_cnt_present_flag: 0
- nal_ref_idc: 3
  nal_unit_type: 15 # Subset sequence parameter set (dependent view)
  profile_idc: 128
  constraint_set_flags: [0,0,0,0,0,0]
  level_idc: 1.0
  chroma_format_idc: 1
  bit_depth: {luma: 8, chroma: 8}
  qpprime_y_zero_transform_bypass_flag: 0
  log2_max_frame_num: 4
  pic_order_cnt_type: 0
  log2_max_pic_order_cnt_lsb: 4
  max_num_ref_frames: 2
  gaps_in_frame_num_value_allowed_flag: 0
  pic_size_in_mbs: {width: 1, height: 1}
  frame_mbs_only_flag: 1
  direct_8x8_inference_flag: 0
  view_ids: [0,1]
  num_anchor_refs: {l0: 0, l1: 0}
  num_non_anchor_refs: {l0: 1, l1: 1}
  level_values_signalled:
    - idc: 1.0
      operation_points: [{temporal_id: 0, target_views: [0,1], num_views: 2}]
- nal_ref_idc: 3
  nal_unit_type: 8 # Picture parameter set (dependent view)
  pic_parameter_set_id: 1
  entropy_coding_mode_flag: 0
  bottom_field_pic_order_in_frame_present_flag: 0
  num_slice_groups: 1
  num_ref_idx_default_active: {l0: 1, l1: 1}
  weighted_pred_flag: 0
  weighted_bipred_idc: 0
  pic_init_qp: 0
  chroma_qp_index_offset: 0
  deblocking_filter_control_present_flag: 0
  constrained_intra_pred_flag: 0
  redundant_pic_cnt_present_flag: 0
# --- AU 0: IDR in both views ---
