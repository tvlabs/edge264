- nal_ref_idc: 0
  nal_unit_type: 10 # End of sequence




# X2: a 2D coded video sequence (base view only, conforming) follows a 3D one, for more access
# units than the 32 base slots. The non-base frames of the 3D sequence must be output at the
# base IDR at the latest, and the 2D frames alone during decoding (currently the last non-base
# frame is never bumped and decoding stalls).
# Expected output: 0 2 4 6 8, then 0b 2b 4b ... 72b output during decoding

