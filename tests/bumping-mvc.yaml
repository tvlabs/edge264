# X5: the non-base view starts in the middle of a coded video sequence, with a non-IDR anchor
# picture (non-conforming, as left by cutting a stereo stream). The first frames are output alone,
# then the views must be paired. This last sequence has no end of sequence, so its last frames
# are flushed at the end of the stream.
# Expected output: 0b 2b 4b 6 8 10 12 14

- {<<: *sps, vui_parameters: {<<: *vui, max_num_reorder_frames: 2, max_dec_frame_buffering: 4}}
- {<<: *pps}
- {<<: *ssps, vui_parameters: {<<: *vui, max_num_reorder_frames: 2, max_dec_frame_buffering: 4}}
- {<<: *pps, pic_parameter_set_id: 1}
# IDR POC 0, base view only
- {<<: *idr}
# AU POC 2, base view only
- {<<: *i, frame_num: {bits: 4, absolute: 1}, pic_order_cnt: {type: 0, bits: 6, absolute: 2}}
# AU POC 4, base view only
- {<<: *i, frame_num: {bits: 4, absolute: 2}, pic_order_cnt: {type: 0, bits: 6, absolute: 4}}
# AU POC 6, the non-base view starts with a non-IDR anchor picture
- {<<: *i, frame_num: {bits: 4, absolute: 3}, pic_order_cnt: {type: 0, bits: 6, absolute: 6}}
- {<<: *i1, anchor_pic_flag: 1, frame_num: {bits: 4, absolute: 0}, pic_order_cnt: {type: 0, bits: 6, absolute: 6}}
# AU POC 8
- {<<: *i, frame_num: {bits: 4, absolute: 4}, pic_order_cnt: {type: 0, bits: 6, absolute: 8}}
- {<<: *i1, frame_num: {bits: 4, absolute: 1}, pic_order_cnt: {type: 0, bits: 6, absolute: 8}}
# AU POC 10
- {<<: *i, frame_num: {bits: 4, absolute: 5}, pic_order_cnt: {type: 0, bits: 6, absolute: 10}}
- {<<: *i1, frame_num: {bits: 4, absolute: 2}, pic_order_cnt: {type: 0, bits: 6, absolute: 10}}
# AU POC 12
- {<<: *i, frame_num: {bits: 4, absolute: 6}, pic_order_cnt: {type: 0, bits: 6, absolute: 12}}
- {<<: *i1, frame_num: {bits: 4, absolute: 3}, pic_order_cnt: {type: 0, bits: 6, absolute: 12}}
# AU POC 14
- {<<: *i, frame_num: {bits: 4, absolute: 7}, pic_order_cnt: {type: 0, bits: 6, absolute: 14}}
- {<<: *i1, frame_num: {bits: 4, absolute: 4}, pic_order_cnt: {type: 0, bits: 6, absolute: 14}}
