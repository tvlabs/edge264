  constrained_intra_pred_flag: 0
  redundant_pic_cnt_present_flag: 0

# AU POC 0
- nal_ref_idc: 1
  nal_unit_type: 5 # Coded slice of an IDR picture
  first_mb_in_slice: 0
  slice_type: 2 # I
  pic_parameter_set_id: 0
