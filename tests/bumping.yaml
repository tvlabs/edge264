# B2: a ref picture without mmco while the only reference is long-term (non-conforming,
# 8.2.5.3). The sliding window must drop the long-term ref instead of failing an assert.
# max_num_reorder_frames=1, max_dec_frame_buffering=1, max_num_ref_frames=1
# Expected output: 0 2 4

- {<<: *sps, vui_parameters: {<<: *vui, max_num_reorder_frames: 1, max_dec_frame_buffering: 1}}
- {<<: *pps}
# POC 0, long-term
- {<<: *idr, long_term_reference_flag: 1}
# POC 2
- {<<: *i, frame_num: {bits: 4, absolute: 1}, pic_order_cnt: {type: 0, bits: 6, absolute: 2}}
# POC 4
- {<<: *i, frame_num: {bits: 4, absolute: 2}, pic_order_cnt: {type: 0, bits: 6, absolute: 4}}
# end of sequence
- {nal_ref_idc: 0, nal_unit_type: 10}



# B3: intra-only streams with max_num_ref_frames=0, where max_dec_frame_buffering=0 (signalled,
