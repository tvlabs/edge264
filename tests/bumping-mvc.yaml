# X5: the non-base view starts in the middle of a coded video sequence, with a non-IDR anchor
# picture (non-conforming, as left by cutting a stereo stream). The first frames are output alone,
# then the views must be paired (currently they are never paired). This last sequence has no end
# of sequence, so its last frames are flushed at the end of the stream.
# Expected output: 0b 2b 4b, then 6 8 10 12 14

