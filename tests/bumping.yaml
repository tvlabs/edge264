# POC 0, releases previous
- {<<: *idr, idr_pic_id: 1}
# end of sequence releases the last frame
- {nal_ref_idc: 0, nal_unit_type: 10}



# B4: pictures with a missing slice. They must be concealed and output, rather than never
# completing, blocking all output and making the final flush return ENOBUFS forever.
# Expected output: 0 4 6 8 (no end of sequence, flushed at the end of the stream)

- {<<: *sps, max_num_ref_frames: 2, pic_size_in_mbs: {width: 2, height: 1}}
- {<<: *pps}
# POC 0, 2 slices
- {<<: *idr}
- {<<: *idr, first_mb_in_slice: 1}
# POC 4, second slice missing
- {<<: *i, frame_num: {bits: 4, absolute: 1}, pic_order_cnt: {type: 0, bits: 6, absolute: 4}}
# POC 8, 2 slices
- {<<: *i, frame_num: {bits: 4, absolute: 2}, pic_order_cnt: {type: 0, bits: 6, absolute: 8}}
- {<<: *i, first_mb_in_slice: 1, frame_num: {bits: 4, absolute: 2}, pic_order_cnt: {type: 0, bits: 6, absolute: 8}}
# POC 6, second slice missing at the end of the stream
- {<<: *i, nal_ref_idc: 0, frame_num: {bits: 4, absolute: 3}, pic_order_cnt: {type: 0, bits: 6, absolute: 6}}
