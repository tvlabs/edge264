--- # Bumping process (C.4.5.3) applied per view with MVC, and the pairing of views at output
# All pictures are identical intra frames, output order and pairing are checked through
# FrameId/FrameId_mvc. Prefix NAL units are optional and only used in M3. Each scenario ends
# with an end of sequence, which bumps both views and realigns their POCs.
# Each view has its own DPB, with the limits of the SPS for the base view and of the SSPS for
# the non-base view, both inferred as for a single view when absent (rather than a DPB shared
# by both views as in C.1 and G.10.2.1 f).
# Pairs of frames of POC p are written p, frames output alone pb (base view) or pn (non-base).
# M scenarios cover the normal behaviour, E scenarios the errors handled today, X scenarios
# the errors currently failing (X1 and X2 never reach ENODATA).



# M1: both views share a hierarchical GOP and identical limits, so each view bumps its own
# frames at the same pictures (C.4.5.3 invoked per view) and every output is a pair.
# max_num_reorder_frames=2, max_dec_frame_buffering=4, max_num_ref_frames=2 in SPS and SSPS
# Expected output: 0 2 4 6 8 10 12 14 16

- nal_ref_idc: 3
  nal_unit_type: 7 # Sequence parameter set
  profile_idc: 100 # High
  constraint_set_flags: [0,0,0,0,0,0]
  level_idc: 1.0
  chroma_format_idc: 1 # 4:2:0
  bit_depth: {luma: 8, chroma: 8}
  qpprime_y_zero_transform_bypass_flag: 0
  log2_max_frame_num: 4
  pic_order_cnt_type: 0
  log2_max_pic_order_cnt_lsb: 6
  max_num_ref_frames: 2
  gaps_in_frame_num_value_allowed_flag: 0
  pic_size_in_mbs: {width: 1, height: 1}
  frame_mbs_only_flag: 1
  direct_8x8_inference_flag: 0
  vui_parameters:
    overscan_appropriate_flag: -1
    pic_struct_present_flag: 0
    motion_vectors_over_pic_boundaries_flag: 1
    log2_max_mv_length_horizontal: 15
    log2_max_mv_length_vertical: 15
    max_num_reorder_frames: 2
    max_dec_frame_buffering: 4

- nal_ref_idc: 3
  nal_unit_type: 8 # Picture parameter set
  pic_parameter_set_id: 0
  entropy_coding_mode_flag: 0 # CAVLC
  bottom_field_pic_order_in_frame_present_flag: 0
  num_slice_groups: 1
  num_ref_idx_default_active: {l0: 1, l1: 1}
  weighted_pred_flag: 0 # average
  weighted_bipred_idc: 0 # average
  pic_init_qp: 0
  chroma_qp_index_offset: 0
  deblocking_filter_control_present_flag: 0
  constrained_intra_pred_flag: 0
  redundant_pic_cnt_present_flag: 0

- nal_ref_idc: 3
  nal_unit_type: 15 # Subset sequence parameter set
  profile_idc: 128 # Stereo High
  constraint_set_flags: [0,0,0,0,0,0]
  level_idc: 1.0
