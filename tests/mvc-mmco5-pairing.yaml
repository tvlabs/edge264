- nal_ref_idc: 2
  nal_unit_type: 20 # dependent P + MMCO5
  non_idr_flag: 1
  priority_id: 0
  view_id: 1
  temporal_id: 0
  anchor_pic_flag: 0
  inter_view_flag: 0
  first_mb_in_slice: 0
  slice_type: 0
  pic_parameter_set_id: 1
  frame_num: {bits: 4, absolute: 2}
  pic_order_cnt: {type: 0, bits: 4, absolute: 4}
  num_ref_idx_active: {override_flag: 0, l0: 1}
  memory_management_control_operations:
  - {mmco: 5}
  slice_qp_delta: 0
  macroblocks_cavlc:
  - mb_skip_run: 0
